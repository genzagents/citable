# Copy this file to .github/workflows/citable-watch.yml in any repo you own (it does not need to be the
# site's repo). Every Monday it checks that ChatGPT, Claude and Perplexity can still read and cite your
# site, keeps an issue per site up to date, and comments on it (GitHub emails you) when something breaks.
name: citable watch

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:        # and whenever you press "Run workflow"

permissions:
  issues: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: genzagents/citable@v0.2.0
        with:
          sites: |
            example.com
            docs.example.com
          # min-score: 75            # also fail if any site drops below this
          # notify: your-github-login # who gets @mentioned on a regression (default: repo owner)
